<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <style>
        /* Небольшие добавки к общему стилю (можешь перенести в login.css) */
        .form-title { text-align: center; margin: 0 0 6px 0; font-size: 20px; font-weight: 700; }
        .form-subtitle { text-align: center; color: #6c757d; margin: 4px 0 2px 0; font-size: 14px; }
        .form-label { font-size: 13px; color: #6c757d; margin: 2px 2px 2px;  }
        .form-error {
            margin-top: 8px;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<form th:action="@{/login}" method="post" novalidate>
    <h2 class="form-title">Вход в систему</h2>
    <p class="form-subtitle">Для работы в информационной системе используйте свой текущий логин и пароль</p>

    <label class="form-label" for="username">Логин</label>
    <input id="username" type="text" name="username" placeholder="Введите логин" autocomplete="username" required />

    <label class="form-label" for="password">Пароль</label>
    <input id="password" type="password" name="password" placeholder="Введите пароль" autocomplete="current-password" required />

    <!-- Сообщение об ошибке авторизации внутри формы -->
    <div class="form-error" th:if="${param.error}">Введён неверный логин или пароль</div>

    <button type="submit">Войти</button>
</form>

</body>
</html>
